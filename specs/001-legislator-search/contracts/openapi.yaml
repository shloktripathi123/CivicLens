openapi: 3.0.3
info:
  title: Civic Lens API
  version: 0.1.0
  description: Public, read-only, no authentication. Every fact carries provenance.
paths:
  /v1/search:
    get:
      summary: Search officials by name
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1}}
        - {name: level, in: query, schema: {type: string, enum: [federal, state, county, local]}}
        - {name: body, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [current, former]}}
        - {name: party, in: query, schema: {type: string}}
        - {name: year, in: query, schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer, default: 20, maximum: 50}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: {type: array, items: {$ref: "#/components/schemas/PersonSummary"}}
                  nextCursor: {type: string, nullable: true}
  /v1/suggest:
    get:
      summary: Typeahead suggestions (max 8)
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PersonSummary"}
  /v1/people/{id}:
    get:
      summary: Full profile (offices, committees, background, affiliations, coverage)
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "404": {description: Not found}
  /v1/people/{id}/timeline:
    get:
      summary: Unified chronological office history across all levels
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Terms
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/OfficeTerm"}
  /v1/people/{id}/bills:
    get:
      summary: Sponsored/cosponsored bills
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {name: role, in: query, schema: {type: string, enum: [sponsor, cosponsor, all], default: all}}
        - {name: topic, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: Paged bills
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: {type: array, items: {$ref: "#/components/schemas/BillSummary"}}
                  nextCursor: {type: string, nullable: true}
  /v1/people/{id}/votes:
    get:
      summary: Roll-call votes with attendance stats
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {name: position, in: query, schema: {type: string, enum: [yea, nay, present, not_voting]}}
        - {name: topic, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: Paged votes
          content:
            application/json:
              schema:
                type: object
                properties:
                  missedVotePct: {type: number}
                  results: {type: array, items: {$ref: "#/components/schemas/VoteRecord"}}
                  nextCursor: {type: string, nullable: true}
  /v1/people/{id}/funding:
    get:
      summary: Campaign finance summary per cycle
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {name: cycle, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Funding
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Funding"}
  /v1/people/{id}/ratings:
    get:
      summary: Third-party ratings and endorsements (publisher-labeled)
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Ratings
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Rating"}
  /v1/bills/{id}:
    get:
      summary: Bill detail with status history; includes the person's vote when personId is given
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {name: personId, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Bill
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillDetail"}
  /v1/compare:
    get:
      summary: Neutral side-by-side comparison of two people
      parameters:
        - {name: a, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: b, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Comparison with shared-vote agreement and method note
          content:
            application/json:
              schema: {type: object}
  /v1/meta/freshness:
    get:
      summary: Last-updated timestamps per source
      responses:
        "200": {description: OK}
components:
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    Provenance:
      type: object
      required: [sourceName, sourceUrl, asOf]
      properties:
        sourceName: {type: string}
        sourceUrl: {type: string, format: uri}
        asOf: {type: string, format: date}
    Coverage:
      type: object
      additionalProperties: {type: string, enum: [complete, partial, unavailable]}
    PersonSummary:
      type: object
      required: [id, name, status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        photoUrl: {type: string, nullable: true}
        status: {type: string, enum: [current, former]}
        level: {type: string}
        body: {type: string}
        party: {type: string, nullable: true}
        state: {type: string, nullable: true}
        district: {type: string, nullable: true}
        years: {type: string, description: "e.g. 2013-present"}
    OfficeTerm:
      type: object
      properties:
        title: {type: string}
        body: {type: string}
        level: {type: string}
        party: {type: string}
        start: {type: string, format: date}
        end: {type: string, format: date, nullable: true}
        provenance: {$ref: "#/components/schemas/Provenance"}
    Profile:
      type: object
      properties:
        person: {$ref: "#/components/schemas/PersonSummary"}
        terms: {type: array, items: {$ref: "#/components/schemas/OfficeTerm"}}
        committees: {type: array, items: {type: object}}
        caucuses: {type: array, items: {type: object}}
        background: {type: array, items: {type: object}}
        contact: {type: object}
        coverage: {$ref: "#/components/schemas/Coverage"}
        lastUpdated: {type: string, format: date-time}
    BillSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        number: {type: string}
        title: {type: string}
        plainSummary: {type: string, nullable: true}
        summaryGenerated: {type: boolean}
        status: {type: string}
        date: {type: string, format: date}
        role: {type: string}
        provenance: {$ref: "#/components/schemas/Provenance"}
    BillDetail:
      allOf:
        - {$ref: "#/components/schemas/BillSummary"}
        - type: object
          properties:
            textUrl: {type: string, format: uri}
            actions: {type: array, items: {type: object}}
            personVote: {type: string, nullable: true}
    VoteRecord:
      type: object
      properties:
        date: {type: string, format: date}
        question: {type: string}
        billId: {type: string, nullable: true}
        position: {type: string}
        result: {type: string}
        provenance: {$ref: "#/components/schemas/Provenance"}
    Funding:
      type: object
      properties:
        cycle: {type: integer}
        totalRaised: {type: number}
        totalSpent: {type: number}
        topContributors: {type: array, items: {type: object}}
        topIndustries: {type: array, items: {type: object}}
        provenance: {$ref: "#/components/schemas/Provenance"}
    Rating:
      type: object
      required: [publisher, year, methodologyUrl]
      properties:
        publisher: {type: string}
        year: {type: integer}
        value: {type: string}
        methodologyUrl: {type: string, format: uri}
        provenance: {$ref: "#/components/schemas/Provenance"}
